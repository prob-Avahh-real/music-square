name: MusicSquare
options:
  bundleIdPrefix: com.musicsquare
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  MusicSquare:
    type: application
    platform: iOS
    sources:
      - MusicSquare
    settings:
      base:
        INFOPLIST_FILE: MusicSquare/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.musicsquare.app
    info:
      path: MusicSquare/Info.plist
      properties:
        CFBundleName: "音悦广场"
        CFBundleDisplayName: "音悦广场"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
